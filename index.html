<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impresora TITO - Web Serial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .info-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .ticket-preview {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .port-info {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 13px;
            color: #495057;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .warning.show {
            display: block;
        }

        .diag-section {
            margin-top: 16px;
        }

        .diag-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .diag-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-diag {
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            background: #f8f9fa;
            color: #333;
            text-transform: none;
            letter-spacing: 0;
            transition: background 0.2s, transform 0.1s;
            line-height: 1.3;
        }

        .btn-diag:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn-diag:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-diag .diag-sub {
            display: block;
            font-size: 10px;
            color: #999;
            font-weight: normal;
            margin-top: 2px;
        }

        .custom-cmd-row {
            display: none; /* eliminado */
        }

        .cmd-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            min-width: 0;
        }

        .cmd-input:focus {
            border-color: #667eea;
        }

        .ticket-form {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
        }

        .form-field input {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }

        .form-field input:focus {
            border-color: #667eea;
        }

        .consola-container {
            margin-top: 20px;
        }

        .consola-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            color: #ccc;
            padding: 6px 12px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .consola-header span {
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .btn-clear {
            flex: none;
            padding: 2px 10px;
            font-size: 11px;
            background: #444;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            text-transform: none;
            font-weight: normal;
            letter-spacing: 0;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background: #555;
            transform: none;
            box-shadow: none;
        }

        .consola-panel {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.7;
            padding: 10px 12px;
            height: 220px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            border: 1px solid #1e1e1e;
            border-top: none;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .consola-panel .log-empty {
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Impresora TITO</h1>
        <p class="subtitle">Envío de tickets mediante Web Serial API</p>

        <div class="ticket-form">
            <div class="diag-title">Datos del ticket</div>
            <div class="form-grid">
                <div class="form-field full">
                    <label>Código de barras</label>
                    <input type="text" id="tkBarcode" value="00-7298-0837-5540-9850" oninput="onBarcodeInput(this)">
                </div>
                <div class="form-field">
                    <label>Casino</label>
                    <input type="text" id="tkCasino" value="BINGO OASIS">
                </div>
                <div class="form-field">
                    <label>Sala</label>
                    <input type="text" id="tkSala" value="Oasis Pilar">
                </div>
                <div class="form-field">
                    <label>Tipo</label>
                    <input type="text" id="tkTipo" value="CPD">
                </div>
                <div class="form-field">
                    <label>Terminal ID</label>
                    <input type="text" id="tkTerminal" value="9">
                </div>
                <div class="form-field">
                    <label>Fecha</label>
                    <input type="text" id="tkFecha" value="07/07/2026">
                </div>
                <div class="form-field">
                    <label>Hora</label>
                    <input type="text" id="tkHora" value="16:54:50">
                </div>
                <div class="form-field">
                    <label>Nro. Ticket</label>
                    <input type="text" id="tkNro" value="2594">
                </div>
                <div class="form-field">
                    <label>Importe (ARS)</label>
                    <input type="text" id="tkImporte" value="0.10" oninput="onImporteInput(this)">
                </div>
                <div class="form-field full">
                    <label>Importe en texto</label>
                    <input type="text" id="tkImporteTxt" value="CERO PESOS CON DIEZ CENTAVOS" readonly style="background:#f8f9fa;color:#555;cursor:default;">
                </div>
                <div class="form-field">
                    <label>Vigencia (días)</label>
                    <input type="text" id="tkVigencia" value="7">
                </div>
                <div class="form-field">
                    <label>Máquina #</label>
                    <input type="text" id="tkMaquina" value="2000000000">
                </div>
            </div>
        </div>

        <div class="warning" id="warningBox">
            ⚠️ <strong>Web Serial API no soportada.</strong><br>
            Por favor usa Chrome, Edge u Opera (versión 89+) para acceder a los puertos seriales.
        </div>

        <button class="btn-success" id="sendBtn" onclick="enviarTicketCompleto()" style="width: 100%;">
            Enviar Ticket de Prueba
        </button>

        <div id="statusBox" class="status"></div>

        <div class="diag-section">
            <div class="diag-title">Diagnóstico</div>
            <div class="diag-grid">
                <button class="btn-diag" onclick="cmd_estado()">📋 Estado ✓
                    <span class="diag-sub">^S|9|^</span>
                </button>
                <button class="btn-diag" onclick="cmd_papel()">🟢 Papel OK?
                    <span class="diag-sub">f4 ≠ 0x74</span>
                </button>
                <button class="btn-diag" onclick="cmd_ticketEnBandeja()">🎫 En bandeja?
                    <span class="diag-sub">f6 = 0x68</span>
                </button>
                <button class="btn-diag" onclick="cmd_esperarRetiro()">⏳ Esperar retiro
                    <span class="diag-sub">poll f6: h→`</span>
                </button>
            </div>
        </div>

        <div class="port-info" id="portInfo" style="display: none;">
            <strong>Puerto conectado:</strong> <span id="portName">-</span>
        </div>

        <div class="consola-container">
            <div class="consola-header">
                <span>&#9654; Consola Serial</span>
                <button class="btn-clear" onclick="limpiarConsola()">Limpiar</button>
            </div>
            <div id="consolaPanel" class="consola-panel">
                <span class="log-empty">Esperando actividad...</span>
            </div>
        </div>
    </div>

    <script src="tito-printer.js"></script>
</body>
</html>
